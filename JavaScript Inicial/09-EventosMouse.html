<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 Eventos Mouse</title>
</head>
<body>

    <div id="caja" style="width: 300px; height: 300px; background-color: blue;"></div>

    <script>
        
        const caja = document.getElementById("caja");

        caja.addEventListener("click", () => alert("Has hecho click"));
        caja.addEventListener("dblclick", () => alert("Has hecho doble click"));
        caja.addEventListener("mouseover", () => alert("Has pasado sobre el elemento"));
        caja.addEventListener("mouseout", () => alert("Te has ido del elemento"));

    </script>
    
</body>
</html>
